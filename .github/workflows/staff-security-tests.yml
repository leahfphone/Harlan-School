name: Staff access security checks
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'staff-access.js'
      - 'teacher-dashboard.html'
      - 'teacher-workspace.html'
      - 'student-assignment.html'
      - 'subject-grading.html'
      - 'tests/staff-*'
      - 'firebase.staff.emulator.json'
      - 'package.json'
      - '.github/workflows/staff-security-tests.yml'
  workflow_dispatch:
jobs:
  staff-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run test:staff:static
      - run: npm run test:staff:rules
