name: Include math keyboard on new assignments
on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'scripts/ensure-math-keyboard.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: math-keyboard-main
  cancel-in-progress: false
jobs:
  attach-keyboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Add shared math keyboard to math answer pages
        run: python scripts/ensure-math-keyboard.py
      - name: Commit changes when needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u -- '*.html'
            git commit -m "Automatically enable math keyboard on new math pages"
            git push
          fi
