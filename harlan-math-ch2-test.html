<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 6 Chapter 2 Test</title><style>body{font:20px/1.6 Verdana,Arial,sans-serif;color:#18324a;background:#f4f7fa;margin:0}main{max-width:850px;margin:auto;padding:22px}section{background:#fff;padding:22px;border-radius:14px;margin:16px 0}input,textarea,button{font:inherit;padding:10px;margin:6px 0}textarea{width:95%;min-height:110px}button{cursor:pointer}button:disabled{opacity:.5}.hidden{display:none}</style></head><body><main><h1>Math 6 — Chapter 2 Test</h1><p id="status" role="status">Sign in to check your teacher's release.</p><section id="login"><label>Email <input id="email" type="email" autocomplete="username"></label><label>Password <input id="password" type="password" autocomplete="current-password"></label><button id="signin">Student sign in</button></section><section id="test" class="hidden"><p id="progress"></p><h2 id="question"></h2><button id="read">Read question aloud</button><button id="stop">Stop reading</button><label for="answer">Answer</label><textarea id="answer"></textarea><label for="work">Show your work</label><textarea id="work"></textarea><div><button id="prev">Previous</button><button id="next">Next</button><button id="submit">Submit to teacher</button></div></section><p><a href="math.html">Back to Math 6</a></p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import {submissionStatus,submitAssignment} from './assignment-submission.js';
const app=initializeApp({apiKey:'AIzaSyCyp8bBl38v5Gb8xVsQrfmdnEXisarqBQQ',authDomain:'harlan-learning-hub.firebaseapp.com',projectId:'harlan-learning-hub',appId:'1:341058218983:web:cb24701e93a511fd336b42'});
const auth=getAuth(app),db=getFirestore(app),assignmentId='math-ch2-test',$=id=>document.getElementById(id);
let questions=[],answers=[],index=0,ready=false;
const status=s=>$('status').textContent=s;
$('signin').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(e){status('Sign-in failed. Ask your teacher for help.')}};
function save(){if(!ready)return;answers[index]={number:index+1,question:questions[index],answer:$('answer').value,work:$('work').value};}
function show(){if(!ready)return;$('progress').textContent='Question '+(index+1)+' of '+questions.length;$('question').textContent=questions[index];$('answer').value=answers[index].answer;$('work').value=answers[index].work;$('prev').disabled=index===0;$('next').disabled=index===questions.length-1;}
$('answer').oninput=save;$('work').oninput=save;
$('prev').onclick=()=>{save();index=Math.max(0,index-1);show()};$('next').onclick=()=>{save();index=Math.min(questions.length-1,index+1);show()};
$('read').onclick=()=>{speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(questions[index]);utterance.rate=.85;speechSynthesis.speak(utterance)};$('stop').onclick=()=>speechSynthesis.cancel();
onAuthStateChanged(auth,async user=>{ready=false;$('test').classList.add('hidden');if(!user||user.isAnonymous){status('Sign in with your assigned student account.');$('login').classList.remove('hidden');return}try{const [access,assignment,release]=await Promise.all([getDoc(doc(db,'studentAccess',user.uid)),getDoc(doc(db,'assignments',assignmentId)),getDoc(doc(db,'assessmentReleases',assignmentId))]);if(!access.exists()||access.data().active!==true||!assignment.exists()||assignment.data().published!==true||release.data()?.released!==true){status('This test is locked or your account is not enrolled.');return}const prior=await submissionStatus({auth,db,assignmentId});if(prior.status==='submitted'||prior.status==='graded'){status('Your test has been submitted. Ask your teacher for results.');return}const content=await getDoc(doc(db,'secureAssessmentContent',assignmentId));if(!content.exists()||!Array.isArray(content.data().questions)||content.data().questions.length!==37||!content.data().questions.every(q=>typeof q==='string')){status('Test questions are not ready. Ask your teacher.');return}questions=content.data().questions;answers=questions.map((q,i)=>({number:i+1,question:q,answer:'',work:''}));index=0;ready=true;$('login').classList.add('hidden');$('test').classList.remove('hidden');status(prior.status==='returned'?'Your teacher returned this test for corrections.':'Released by your teacher.');show()}catch(e){status('Unable to load your test. Ask your teacher for help.')}});
$('submit').onclick=async()=>{if(!ready)return;save();if(!confirm('Submit all 37 answers to your teacher?'))return;$('submit').disabled=true;try{const result=await submitAssignment({auth,db,assignmentId,responses:answers});ready=false;$('test').classList.add('hidden');status('Submitted successfully. Attempt '+result.attempt+'.')}catch(e){status('Submission did not save. Keep this page open and ask your teacher. '+e.message);$('submit').disabled=false}};
</script></body></html>
