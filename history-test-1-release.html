<!doctype html><html lang="en"><head><script src="https://harlan-learning-hub-voice1.web.app/v1/hub-voice/hub-voice.js?v=20261028"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>History & Geography Test 1 | Harlan's Learning Hub</title><style>body{margin:0;font-family:Verdana,Arial,sans-serif;background:#f4f7f8;color:#172b3d}#status{padding:18px;background:#fff4d9;font-weight:bold;line-height:1.5}iframe{display:block;width:100%;height:100vh;border:0}button{font:inherit;padding:12px;background:#17617f;color:white;border:0;border-radius:8px}</style></head><body><div id="status" role="status">Checking whether your teacher has released Test 1…</div><main id="main"></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getAuth,signInAnonymously}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';const app=initializeApp({apiKey:'AIzaSyCyp8bBl38v5Gb8xVsQrfmdnEXisarqBQQ',authDomain:'harlan-learning-hub.firebaseapp.com',projectId:'harlan-learning-hub',appId:'1:341058218983:web:cb24701e93a511fd336b42'}),auth=getAuth(app),db=getFirestore(app),status=document.getElementById('status'),main=document.getElementById('main');let frame=null,sending=false,delivered=false;const id='history-test-1';async function start(){try{if(!auth.currentUser)await signInAnonymously(auth);const release=await getDoc(doc(db,'assessmentReleases',id));if(!release.exists()||release.data().released!==true){status.textContent='This test has not been released by your teacher yet.';return}const content=await getDoc(doc(db,'protectedAssessments',id));if(!content.exists()||typeof content.data().html!=='string'){status.textContent='The test is not ready. Please ask your teacher.';return}frame=document.createElement('iframe');frame.title='History and Geography Test 1';frame.srcdoc=content.data().html;main.append(frame);status.textContent='Complete your test below. After submitting, wait for confirmation that your teacher received your answers.'}catch(e){status.textContent='Unable to open this test ('+(e.code||'connection error')+'). Please try again or ask your teacher.'}}window.addEventListener('message',async event=>{if(!frame||event.source!==frame.contentWindow||event.data?.type!=='harlan-test-submitted'||sending||delivered)return;const data=event.data;if(!Array.isArray(data.answers)||data.answers.length!==61){status.textContent='The answers could not be checked for delivery. Ask your teacher.';return}sending=true;status.textContent='Sending your completed test to your teacher…';try{const user=auth.currentUser|| (await signInAnonymously(auth)).user;await setDoc(doc(db,'submissions','test1_'+user.uid),{student:String(data.student||'Harlan').slice(0,100),studentUid:user.uid,testTitle:'History & Geography — Test 1',submittedAt:serverTimestamp(),responses:data.answers.map((r,i)=>({number:i+1,question:String(r.question||''),answer:String(r.answer||''),section:String(r.section||'')}))});delivered=true;status.textContent='Your completed test was delivered to your teacher. You may close this page.'}catch(e){status.textContent='Delivery was not confirmed ('+(e.code||'connection issue')+'). Your answers are saved on this device. Keep this page open and ask your teacher for help.'}finally{sending=false}});start();</script></body></html>
