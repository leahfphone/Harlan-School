<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>History — Documents We Memorize</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f7fb;color:#182638;margin:0;line-height:1.6}main{max-width:1000px;margin:auto;padding:22px}h1{font-size:2rem}h2{color:#1d4977}section{background:white;border:2px solid #d5e1ed;border-radius:15px;padding:22px;margin:18px 0}.nav{display:inline-block;background:#fff;padding:10px 16px;border-radius:10px;border:2px solid #ccd7e5;color:#163a61;text-decoration:none;margin-right:8px}.question{margin:16px 0;padding:12px;background:#f7faff;border-radius:8px}textarea,input{font:inherit;border:2px solid #bacbdc;border-radius:8px;padding:10px;width:100%;max-width:700px}textarea{min-height:70px}button{background:#1f5d92;color:white;border:0;padding:12px 16px;border-radius:10px;font-weight:bold;cursor:pointer;margin:6px 4px 6px 0}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid orange}.map{width:100%;height:auto;border:1px solid #ddd}details{background:#edf4fc;padding:12px;border-radius:9px;margin:12px 0}p{margin:10px 0}.muted{color:#52647a}.longtext{white-space:pre-wrap} @media print{button,.nav,.controls{display:none!important}body{background:white}section{break-inside:avoid;border:1px solid #bbb}}</style><style id="harlan-accessibility">body{font-size:19px;line-height:1.75}main{max-width:1050px}p,li,.question{line-height:1.75}button,.nav{font-size:18px;min-height:46px}textarea,input{font-size:19px;line-height:1.6}h1{line-height:1.25}h2{line-height:1.35}.map{max-width:100%;height:auto}@media(max-width:650px){body{font-size:18px}main{padding:14px}section{padding:16px}h1{font-size:1.7rem}button{margin-bottom:9px}}@media print{body{font-size:12pt;line-height:1.5}}</style></head><body><main><a class="nav" href="history.html">← History & Geography</a><h1>History — Documents We Memorize</h1><div class="controls"><button onclick="speakText('reading')">▶ Read aloud</button><button onclick="stopSpeech()">■ Stop</button><button onclick="window.print()">Print</button></div><div id="reading"><section><h2>Documents We Memorize</h2><p><a class="nav" href="harlan-declaration-of-independence.html">Declaration of Independence — Original & Study Guide</a></p><p><a class="nav" href="harlan-americans-creed.html">The American’s Creed — Read & Memorize</a></p></section></div></main><script>function speakText(id){if(!('speechSynthesis'in window)){alert('Read aloud is not supported by this browser.');return;}speechSynthesis.cancel();let t=document.getElementById(id);let u=new SpeechSynthesisUtterance(t.innerText);u.rate=.83;speechSynthesis.speak(u)}function stopSpeech(){speechSynthesis.cancel()}function saveAnswers(){document.querySelectorAll('textarea').forEach((e,i)=>localStorage.setItem(location.pathname+'-answer-'+i,e.value))}window.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('textarea').forEach((e,i)=>{e.value=localStorage.getItem(location.pathname+'-answer-'+i)||'';e.addEventListener('input',saveAnswers)})})</script></body></html>
