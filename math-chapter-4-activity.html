on')||'31';const lesson=lessons.find(x=>x[0]===id)||lessons[0];const storageKey='harlan-ch4-'+id;const $=s=>document.getElementById(s);$('title').textContent=(/^\d+$/.test(id)?'Lesson '+id+' — ':'')+lesson[1];$('goal').textContent=lesson[2];$('method').textContent=lesson[3];function speak(s){if(!window.speechSynthesis){alert('Read aloud is unavailable');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s.replaceAll('/',' over ').replaceAll('×',' times ').replaceAll('÷',' divided by '));u.rate=.82;speechSynthesis.speak(u)}$('readLesson').onclick=()=>speak(lesson[2]);$('readMethod').onclick=()=>speak(lesson[3]);let saved={};try{saved=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){}const inputs=[],notes=[],histories=[];const norm=s=>String(s).trim().toLowerCase().replace(/\s+/g,' ').replace(/,/g,'');function snapshot(){return {answers:inputs.map(x=>x.value),notes:notes.map(x=>x.value),history:histories}}function save(){localStorage.setItem(storageKey,JSON.stringify(snapshot()));$('status').textContent='Saved on this device.'}lesson[4].forEach((q,i)=>{let c=document.createElement('section');c.className='card';let h=document.createElement('h2');h.textContent='Question '+(i+1);let p=document.createElement('p');p.textContent=q[0];let read=document.createElement('button');read.textContent='🔊 Read question';read.onclick=()=>speak(q[0]);let inp=document.createElement('input');inp.setAttribute('aria-label','Answer '+(i+1));inp.value=saved.answers?.[i]||'';inputs[i]=inp;let n=document.createElement('textarea');n.placeholder='Show your work (optional)';n.setAttribute('aria-label','Work for question '+(i+1));n.value=saved.notes?.[i]||'';notes[i]=n;let check=document.createElement('button');check.textContent='Check my work';let feedback=document.createElement('p');feedback.setAttribute('role','status');histories[i]=saved.history?.[i]||[];check.onclick=()=>{let ok=norm(inp.value)===norm(q[1]);histories[i].push({answer:inp.value,correct:ok,checkedAt:new
