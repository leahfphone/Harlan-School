<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher Review — Development Preview</title>
<style>body{font:18px/1.5 Arial,sans-serif;max-width:920px;margin:20px auto;padding:15px;background:#f5f7fa;color:#182536}section{background:white;border:1px solid #cbd4df;border-radius:12px;padding:20px;margin:16px 0}input,textarea,button{font:inherit;padding:10px;margin:5px}textarea{width:95%;min-height:85px}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}article{border-top:1px solid #ddd;padding:10px 0}@media print{button,#login,#finder{display:none}body{background:white}}</style>
</head><body>
<h1>Teacher Review — Development Preview</h1>
<p>This page is not linked from the live Learning Hub. It requires the new Firebase collections and security rules before it can retrieve assignments.</p>
<section id="login"><h2>Teacher sign-in</h2><label>Email <input id="email" type="email" autocomplete="username"></label><label>Password <input id="password" type="password" autocomplete="current-password"></label><button id="signin">Sign in</button><button id="signout">Sign out</button></section>
<section id="finder"><h2>Find assignment</h2><label>Student UID <input id="uid" autocomplete="off"></label><label>Assignment ID <input id="assignment" autocomplete="off"></label><button id="load">Load work</button></section>
<p id="status" role="status"></p><section id="review" hidden><h2>Submitted work</h2><div id="summary"></div><div id="attempts"></div><h3>Grade current submission</h3><label>Points earned <input id="score" type="number" min="0" step=".5"></label><label>Points possible <input id="max" type="number" min="0.5" step=".5"></label><label>Comments <textarea id="comments"></textarea></label><button id="grade">Save grade</button><button id="return">Return for corrections</button><button onclick="window.print()">Print work</button></section>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import {loadTeacherReview,gradeAssignment,returnForCorrections} from './assignment-teacher.js';
const config={apiKey:'AIzaSyCyp8bBl38v5Gb8xVsQrfmdnEXisarqBQQ',authDomain:'harlan-learning-hub.firebaseapp.com',projectId:'harlan-learning-hub',appId:'1:341058218983:web:cb24701e93a511fd336b42'};
const app=initializeApp(config);const auth=getAuth(app);const db=getFirestore(app);const $=id=>document.getElementById(id);
const say=s=>$('status').textContent=s;
const ref=()=>({studentUid:$('uid').value.trim(),assignmentId:$('assignment').value.trim()});
$('signin').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(e){say('Sign-in failed: '+e.code)}};
$('signout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{say(u?'Signed in: '+u.email:'Teacher sign-in required');$('review').hidden=true});
async function load(){
  try{
    const d=await loadTeacherReview({db,...ref()});
    $('review').hidden=false;
    $('summary').textContent='Status: '+d.state.status+' | Current attempt: '+d.state.currentAttempt;
    $('attempts').replaceChildren();
    for(const a of d.attempts){
      const article=document.createElement('article');
      const h=document.createElement('h3');h.textContent='Attempt '+a.attemptNumber;
      article.append(h);
      const p=document.createElement('p');p.textContent='Submitted: '+(a.submittedAt?.toDate?.().toLocaleString()||'Pending');article.append(p);
      (a.responses||[]).forEach((r,i)=>{
        const item=document.createElement('div');item.style.margin='12px 0';
        const title=document.createElement('strong');title.textContent=(r.number||i+1)+'. '+(r.question||'');
        const ans=document.createElement('p');ans.textContent='Answer: '+(r.answer||'(blank)');
        const work=document.createElement('p');work.textContent='Work: '+(r.work||'(none)');
        item.append(title,ans,work);article.append(item);
      });
      const feedback=d.feedback.find(f=>f.attemptNumber===a.attemptNumber);
      if(feedback){const p=document.createElement('p');p.textContent='Grade: '+feedback.score+'/'+feedback.maxScore+' — '+(feedback.comments||'');article.append(p)}
      $('attempts').append(article);
    }
    $('grade').disabled=d.state.status!=='submitted';
    $('return').disabled=!['submitted','graded'].includes(d.state.status);
    say('Assignment loaded.');
  }catch(e){$('review').hidden=true;say('Could not load assignment: '+(e.code||e.message))}
}
$('load').onclick=load;
$('grade').onclick=async()=>{try{await gradeAssignment({auth,db,...ref(),score:$('score').value.trim()===''?NaN:Number($('score').value),maxScore:$('max').value.trim()===''?NaN:Number($('max').value),comments:$('comments').value});await load();say('Grade saved.')}catch(e){say('Grade not saved: '+(e.code||e.message))}};
$('return').onclick=async()=>{if(!confirm('Return this assignment for corrections?'))return;try{await returnForCorrections({auth,db,...ref()});await load();say('Returned for corrections.')}catch(e){say('Not returned: '+(e.code||e.message))}};
</script></body></html>
