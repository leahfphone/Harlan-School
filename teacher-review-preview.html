<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher Review — Development Preview</title>
<style>body{font:18px/1.5 Arial,sans-serif;max-width:920px;margin:20px auto;padding:15px;background:#f5f7fa;color:#182536}section{background:white;border:1px solid #cbd4df;border-radius:12px;padding:20px;margin:16px 0}input,textarea,button{font:inherit;padding:10px;margin:5px}textarea{width:95%;min-height:85px}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}article{border-top:1px solid #ddd;padding:10px 0}@media print{button,#login,#finder,#dashboard,#grading,#status,#environment{display:none!important}article{break-inside:avoid}body{background:white}}</style>
</head><body>
<h1>Teacher Review — Development Preview</h1>
<p>This page is not linked from the live Learning Hub. It requires the new Firebase collections and security rules before it can retrieve assignments.</p>
<p id="environment"></p><section id="login"><h2>Teacher sign-in</h2><label>Email <input id="email" type="email" autocomplete="username"></label><label>Password <input id="password" type="password" autocomplete="current-password"></label><button id="signin">Sign in</button><button id="signout">Sign out</button></section>
<section id="dashboard"><h2>Submitted assignments</h2><label>Subject <select id="subject"><option value="">All subjects</option></select></label><label>Status <select id="statusFilter"><option value="">All statuses</option><option>submitted</option><option>graded</option><option>returned</option></select></label><button id="refresh">Refresh submissions</button><div id="workItems"></div></section><section id="finder"><h2>Find assignment</h2><label>Student UID <input id="uid" autocomplete="off"></label><label>Assignment ID <input id="assignment" autocomplete="off"></label><button id="load">Load work</button><button id="grant">Grant assignment access</button><button id="revoke">Revoke assignment access</button></section>
<p id="status" role="status"></p><section id="review" hidden><h2>Submitted work</h2><div id="summary"></div><div id="attempts"></div><div id="grading"><h3>Grade current submission</h3><label>Points earned <input id="score" type="number" min="0" step=".5"></label><label>Points possible <input id="max" type="number" min="0.5" step=".5"></label><label>Comments <textarea maxlength="10000" id="comments"></textarea></label><button id="grade">Save grade</button><button id="return">Return for corrections</button></div><button onclick="window.print()">Print work</button></section>
<script type="module" src="./teacher-review-preview.js"></script></body></html>
