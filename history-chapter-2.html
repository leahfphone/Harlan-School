const lessons=[
["2.1 A Trip to the North Pole","The North Pole is in the Arctic Ocean, not on land. The Arctic lies between the North Pole and the northern timberline. Near the pole, the sun can stay above or below the horizon for months. The aurora borealis is also called the northern lights. The Arctic Ocean is the smallest ocean. Glaciers are large masses of moving ice. Pieces that break into the sea become icebergs. Arctic animals include plankton, fish, seals, walruses, whales, polar bears, and puffins. Fur seals have insulating blubber and thick fur.",["What is another name for the northern lights?","What are glaciers, and where do icebergs come from?","How do fur seals help people living near the Arctic?"]],
["2.2 The Tundra","The tundra is a cold, mostly treeless region north of the timberline. In summer, some areas have daylight throughout the night, giving the tundra the nickname Land of the Midnight Sun. Permafrost is ground that remains frozen throughout the year. Plants include mosses, lichens, shrubs, and tiny arctic willows. Animals include arctic terns, ptarmigans, musk oxen, caribou, wolves, foxes, and lemmings. Caribou have long been important for food, clothing, and tools.",["Why is the tundra called the Land of the Midnight Sun?","What is permanently frozen ground called?"]],
["2.3 The People of the Tundra","Indigenous peoples of the Arctic developed ways to live in a cold environment. Inuit communities live in Arctic Canada and Greenland; many Indigenous communities also live in Alaska. Traditional clothing included warm parkas and boots made from animal skins. Shelters included tents, sod houses, and temporary snow igloos. Dogsleds carried people across snow and ice. Kayaks were small covered boats, and umiaks were larger open boats. Harpoons were used in hunting. Today Arctic communities have diverse modern lives and occupations.",["What names does the textbook use for people of northern Alaska and Arctic Canada?","How did people traditionally travel over snow and water?","Why did some Arctic residents move into towns and villages?","Which missionary does the textbook name?"]],
["2.4 The Northern Woodlands","South of the tundra are the northern woodlands, called the taiga or boreal forest. Many trees are conifers, which produce cones; evergreens keep their leaves all year. Spruce, pine, and fir are common. Broadleaf trees have wide leaves, and deciduous trees lose their leaves seasonally. Paper birch bark was used to make canoes and baskets. Animals include moose, woodland caribou, beavers, weasels, wolves, ravens, and eagles. Beavers shape waterways by building dams and lodges.",["What are two names for the northern forest?","How did Indigenous people use paper birch?","Which animal has greatly shaped the landscape?"]],
["2.5 The Indians of the Far North","The textbook names the Cree, Ottawa, Yellowknife, Beaver, and Ojibwa among Indigenous peoples of the northern forests. Hunting, fishing, and gathering provided food. People used birch-bark canoes in summer and snowshoes and toboggans in winter. Pemmican was made from dried meat, fat, and sometimes berries. Clothing included moccasins and warm animal-skin garments. Homes varied, including wooden winter houses and temporary shelters. Children learned survival skills by watching and practicing with family members.",["Name five Indigenous groups listed in the lesson.","How did children traditionally learn survival skills?"]]
