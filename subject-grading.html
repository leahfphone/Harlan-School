<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subject Grading — Staff Preview</title><style>body{font-family:system-ui,Arial,sans-serif;background:#f5f7fb;color:#1c3045;margin:0}main{max-width:900px;margin:auto;padding:24px}.card{background:white;border:1px solid #cbd5e1;border-radius:14px;padding:20px;margin:18px 0}label{display:block;margin:12px 0 5px;font-weight:600}select,input,textarea,button{font:inherit;padding:10px;border-radius:8px}select,input,textarea{width:100%;border:1px solid #94a3b8}textarea{min-height:90px}button{background:#24567b;color:white;border:0;cursor:pointer}.hidden{display:none}article{border-top:1px solid #ddd;padding:16px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5f9;padding:12px;border-radius:8px}</style></head><body><main><h1>Subject Grading</h1><p><a href="staff-dashboard.html">Back to Staff Dashboard</a></p><p id="status" role="status">Checking staff access…</p><section id="panel" class="hidden"><div class="card"><label for="subject">Subject</label><select id="subject"></select><button id="refresh">Refresh submissions</button></div><div class="card"><h2>Student work</h2><div id="items"></div></div></section><script type="module">
import {auth,db} from './firebase-client.js';
import {loadStaffAccess,SUBJECTS,canEditSubject} from './staff-access.js';
import {onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {collection,query,where,getDocs,getDoc,doc,setDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const $=id=>document.getElementById(id);let access=null;
function say(message){$('status').textContent=message}
async function refresh(){const subject=$('subject').value;if(!canEditSubject(access,subject))return;$('items').replaceChildren();try{const results=await getDocs(query(collection(db,'classSubmissions'),where('subject','==',subject)));if(results.empty){$('items').textContent='No submissions in this subject.';return}
for(const entry of results.docs){const data=entry.data();const grade=await getDoc(doc(db,'classGrades',entry.id));const article=document.createElement('article');const heading=document.createElement('h3');heading.textContent=(data.student||'Student')+' — '+entry.id;article.append(heading);const answers=document.createElement('pre');answers.textContent=JSON.stringify(data.responses||[],null,2);article.append(answers);const form=document.createElement('form');const scoreLabel=document.createElement('label');scoreLabel.textContent='Score (0–100)';const score=document.createElement('input');score.type='number';score.min='0';score.max='100';score.step='0.01';score.required=true;score.value=grade.exists()?String(grade.data().score):'';scoreLabel.append(score);form.append(scoreLabel);const feedbackLabel=document.createElement('label');feedbackLabel.textContent='Teacher feedback';const feedback=document.createElement('textarea');feedback.maxLength=10000;feedback.value=grade.exists()?grade.data().feedback:'';feedbackLabel.append(feedback);form.append(feedbackLabel);const save=document.createElement('button');save.textContent='Save grade';form.append(save);form.onsubmit=async e=>{e.preventDefault();save.disabled=true;try{await setDoc(doc(db,'classGrades',entry.id),{score:Number(score.value),feedback:feedback.value,gradedBy:auth.currentUser.uid,gradedAt:serverTimestamp()});say('Grade saved for '+(data.student||'student'))}catch(err){say('Could not save grade: '+err.code)}finally{save.disabled=false}};article.append(form);$('items').append(article)}}catch(err){say('Could not load submissions: '+err.code)}}
$('subject').onchange=refresh;$('refresh').onclick=refresh;
onAuthStateChanged(auth,async user=>{$('panel').classList.add('hidden');$('items').replaceChildren();if(!user){say('Sign in through the Staff Dashboard first.');return}try{access=await loadStaffAccess(user);if(!access){say('Verified staff access is required.');return}$('subject').replaceChildren();for(const subject of SUBJECTS){if(canEditSubject(access,subject.id)){const option=document.createElement('option');option.value=subject.id;option.textContent=subject.name;$('subject').append(option)}}$('panel').classList.remove('hidden');say('Subject access verified.');await refresh()}catch(err){say('Access check failed: '+err.code)}});
</script></main></body></html>
