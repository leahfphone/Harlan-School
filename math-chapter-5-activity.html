const lessons=[["41","Estimating Sums & Differences","Round each fraction to 0, 1/2, or 1 before estimating.","Compare numerator with denominator. Round mixed-number fractions before adding or subtracting.",[["Round 7/8 to 0, 1/2, or 1.","1","Seven eighths is very close to a whole."],["Estimate 2/9 + 5/6.","1","Round each fraction separately to 0, one-half, or one."],["Round 3 3/4 to the nearest whole number.","4","The fraction is greater than one-half."]]],["42","Adding & Subtracting Like Fractions","Add and subtract fractions with matching denominators.","Keep the denominator; add or subtract the numerators. Simplify at the end.",[["Find 2/9 + 4/9.","2/3","Add the numerators, then simplify."],["Find 7/10 - 3/10.","2/5","Keep tenths and simplify the result."],["Find 2 1/8 + 1 3/8.","3 1/2","Add whole numbers and fractional parts separately."]]],["43","Adding & Subtracting Related Fractions","Rename related fractions to a common denominator.","One denominator is a multiple of the other. Rename before adding or subtracting.",[["Find 1/2 + 1/4.","3/4","Rename one-half as fourths."],["Find 5/6 - 1/3.","1/2","Rename thirds as sixths."],["Find 3/4 + 1/8.","7/8","Rename fourths as eighths."]]],["44","Adding & Subtracting Unlike Fractions","Use the LCM to find a common denominator.","Rename both fractions with a shared denominator; combine and simplify.",[["Find 1/3 + 1/4.","7/12","The least common denominator is 12."],["Find 5/6 - 1/4.","7/12","Try twelfths as the common denominator."],["Find 2/5 + 1/3.","11/15","Rename both fractions as fifteenths."]]],["45","More Fractions & Mixed Numbers","Add and subtract mixed numbers with different denominators.","Find a common denominator for fractional parts. Rename a whole if subtraction requires it.",[["Find 1 1/2 + 2 1/3.","3 5/6","Add wholes; rename halves and thirds as sixths."],["Find 4 1/4 - 1 1/2.","2 3/4","Rename the fourths and halves, then borrow a whole."],["Find 2 1/3 + 1 1/4 + 1 1/6.","4 3/4","Use twelfths for the fractional parts."]]],["46","Guess & Check","Make a guess, test it, and improve your next guess.","Write what you tried and whether it was too high or too low.",[["Two numbers total 30. One is twice the other. What is the smaller number?","10","Try a smaller number and double it. Do they total 30?"],["Two numbers total 40 and differ by 8. What is the smaller number?","16","Start with half of 40 and adjust both numbers."],["A rope is 60 cm long. It is cut into parts in the ratio 1:2:3. How long is the shortest part?","10","There are six equal shares altogether."]]],["review","Chapter Review","Review estimation and operations with fractions.","Check common denominators and simplify every answer.",[["Estimate 1/8 + 7/8 using 0, 1/2, or 1.","1","One fraction is near zero and the other near one."],["Find 3/8 + 1/4.","5/8","Rename one-fourth as eighths."],["Find 2 1/3 - 3/4.","1 7/12","Use twelfths, and rename one whole if needed."]]],["cumulative","Cumulative Review","Review Chapter 5 along with previous math skills.","Use place value, arithmetic properties, and fraction skills.",[["Find 149.9 + 13.03.","162.93","Line up decimal points."],["Find 49 × 27.","1323","Use 40 × 27 plus 9 × 27."],["Find 3/4 + 2/3.","1 5/12","Find a common denominator of 12."]]]];const id=new URLSearchParams(location.search).get('lesson')||'41';const lesson=lessons.find(x=>x[0]===id)||lessons[0];

const storageKey='harlan-ch5-'+id;const $=s=>document.getElementById(s);$('title').textContent=(/^\d+$/.test(id)?'Lesson '+id+' — ':'')+lesson[1];$('goal').textContent=lesson[2];$('method').textContent=lesson[3];function speak(s){if(!window.speechSynthesis){alert('Read aloud is unavailable');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s.replaceAll('/',' over ').replaceAll('×',' times ').replaceAll('÷',' divided by '));u.rate=.82;speechSynthesis.speak(u)}$('readLesson').onclick=()=>speak(lesson[2]);$('readMethod').onclick=()=>speak(lesson[3]);let saved={};try{saved=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){}const inputs=[],notes=[],histories=[],checkButtons=[];const norm=s=>String(s).trim().toLowerCase().replace(/\s+/g,' ').replace(/,/g,'');function snapshot(){return {answers:inputs.map(x=>x.value),notes:notes.map(x=>x.value),history:histories}}function save(){localStorage.setItem(storageKey,JSON.stringify(snapshot()));$('status').textContent='Saved on this device.'}lesson[4].forEach((q,i)=>{let c=document.createElement('section');c.className='card';let h=document.createElement('h2');h.textContent='Question '+(i+1);let p=document.createElement('p');p.textContent=q[0];let read=document.createElement('button');read.textContent='🔊 Read question';read.onclick=()=>speak(q[0]);let inp=document.createElement('input');inp.setAttribute('aria-label','Answer '+(i+1));inp.value=saved.answers?.[i]||'';inputs[i]=inp;let n=document.createElement('textarea');n.placeholder='Show your work (optional)';n.setAttribute('aria-label','Work for question '+(i+1));n.value=saved.notes?.[i]||'';notes[i]=n;let check=document.createElement('button');check.textContent='Check my work';checkButtons.push(check);let feedback=document.createElement('p');feedback.setAttribute('role','status');histories[i]=saved.history?.[i]||[];check.onclick=()=>{let ok=norm(inp.value)===norm(q[1]);histories[i].push({answer:inp.value,correct:ok,checkedAt:new Date().toISOString()}
