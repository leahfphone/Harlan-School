<!doctype html><html lang='en'><meta charset='utf-8'><title>Unit 4 | Harlan's Learning Hub</title><main><a href='grammar.html'>Grammar</a><h1>Unit 4: From Colons to Quotations</h1><p>Read aloud, answer, save, and print your work.</p><label>Lesson <select id='lesson'></select></label><button onclick='readLesson()'>Read aloud</button><button onclick='speechSynthesis.cancel()'>Stop</button><button onclick='check()'>Check progress</button><button onclick='print()'>Print teacher report</button><h2 id='heading'></h2><p id='directions'></p><div id='questions'></div><p id='feedback' role='status'></p></main><style>body{font:20px/1.6 Arial;background:#f4f7fa;color:#173047}main{max-width:850px;margin:auto;background:white;padding:24px}button,select,textarea{font:inherit;margin:8px;padding:8px}textarea{display:block;width:90%;min-height:90px}label{display:block;margin:12px 0}button:focus,textarea:focus{outline:3px solid orange}@media print{button,select{display:none}}</style><script>const lessons=[['Semicolons and colons','A semicolon connects closely related complete sentences. A colon can introduce a list after a complete sentence.',['Correct: I studied hard I felt ready.','Correct: Bring these supplies pencils paper and a notebook.']],['Quotation marks and hyphens','Quotation marks surround exact spoken words. Hyphens connect certain compound words.',['Punctuate: Mom said Please come inside.','Write a sentence of dialogue.']],['Apostrophes and review','Apostrophes show possession or missing letters in contractions.',['Correct: The students book is here.','Write the contraction for do not.','Correct the run-on: I read the chapter I answered the questions.']]];const key='harlan-unit4',answers=JSON.parse(localStorage.getItem(key)||'{}'),s=document.getElementById('lesson');s.innerHTML=lessons.map((x,i)=>'<option value='+i+'>'+x[0]+'</option>').join('');s.onchange=render;function render(){let n=+s.value,l=lessons[n];document.getElementById('heading').textContent=l[0];document.getElementById('directions').textContent=l[1];let box=document.getElementById('questions');box.replaceChildren();l[2].forEach((q,i)=>{let label=document.createElement('label'),t=document.createElement('textarea'),id=n+'-'+i;label.textContent=q;t.value=answers[id]||'';t.oninput=()=>{answers[id]=t.value;localStorage.setItem(key,JSON.stringify(answers))};box.append(label,t)})}function readLesson(){speechSynthesis.cancel();let l=lessons[+s.value],u=new SpeechSynthesisUtterance(l[0]+'. '+l[1]+'. '+l[2].join('. '));u.rate=.85;speechSynthesis.speak(u)}function check(){let n=+s.value,l=lessons[n];document.getElementById('feedback').textContent=l[2].filter((q,i)=>(answers[n+'-'+i]||'').trim()).length+' of '+l[2].length+' answered. Answers remain editable; teacher checks correctness.'}render()</script></html>
