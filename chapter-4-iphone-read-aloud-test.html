<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 4 — iPhone Audio Diagnostic v2</title><style>body{font:19px/1.5 system-ui,sans-serif;max-width:750px;margin:auto;padding:20px;background:#f5f7fb;color:#17202a}button{font:inherit;padding:14px;margin:7px 4px;border-radius:12px;background:white;border:2px solid #445b80}p{padding:14px;background:white;border-radius:12px}#status{font-weight:bold;white-space:pre-wrap}.active{background:#fff2a0}small{display:block}</style><a href="history.html">← History</a><h1>Chapter 4 — iPhone Audio Test v2</h1><p>Open this page in Safari. First tap Test Sound, then tap Test Speech. The text will only highlight when Safari reports speech has started.</p><button id="tone">▶ Test Sound</button><button id="speak">🔊 Test Speech</button><button id="stop">■ Stop</button><p id="status" role="status" aria-live="polite">Ready.</p><p id="words">The Eastern United States has mountains, forests, rivers, and coastal plains.</p><script src="https://harlan-learning-hub-voice1.web.app/v1/hub-voice/hub-voice.js?v=20261028"></script><script>
const statusBox=document.getElementById('status'),words=document.getElementById('words');let audioCtx=null,osc=null,utter=null;
function status(s){statusBox.textContent=s}
function stop(){try{speechSynthesis.cancel()}catch(e){};if(osc){try{osc.stop()}catch(e){}osc=null};words.classList.remove('active');status('Stopped.')}
document.getElementById('stop').onclick=stop;
document.getElementById('tone').onclick=async()=>{stop();try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC){status('Web Audio is unavailable.');return}audioCtx=audioCtx||new AC();await audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=440;g.gain.value=.13;o.connect(g);g.connect(audioCtx.destination);o.start();osc=o;status('Playing a 1-second tone. Did you hear it?');o.stop(audioCtx.currentTime+1);o.onended=()=>{if(osc===o)osc=null}}catch(e){status('Sound error: '+e.message)}};
document.getElementById('speak').onclick=()=>{stop();if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){status('Speech synthesis unavailable in this browser.');return}try{const u=new SpeechSynthesisUtterance(words.textContent);utter=u;u.lang='en-US';u.rate=.9;u.volume=1;u.onstart=()=>{if(utter!==u)return;words.classList.add('active');status('Safari reported that speech STARTED. Can you hear the words?')};u.onend=()=>{if(utter!==u)return;words.classList.remove('active');status('Safari reported that speech ENDED.')};u.onerror=e=>{if(utter!==u)return;words.classList.remove('active');status('Safari speech error: '+e.error)};status('Speech requested. Waiting for Safari to report it started…');speechSynthesis.speak(u);setTimeout(()=>{if(utter===u&&!words.classList.contains('active')&&speechSynthesis.pending)status('Still waiting: speech is queued but has not started.');},2500)}catch(e){status('Speech exception: '+e.message)}};
</script></html>
