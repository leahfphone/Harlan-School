<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spelling & Vocabulary Test 5</title><style>body{font:20px/1.5 Arial,sans-serif;background:#f4f6fa;color:#172b40;margin:0}main{max-width:760px;margin:40px auto;padding:25px}section{background:white;border:2px solid #cbd5e1;border-radius:16px;padding:28px}a{color:#164c76}</style></head><body><main><a href="spelling-vocabulary.html">← Spelling & Vocabulary</a><section><h1>Test 5 — Spelling & Vocabulary</h1><p id="status" role="status">Checking teacher release…</p><div id="viewer"></div></section></main><script type="module">import{auth,db}from'./firebase-client.js';import{signInAnonymously}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import{doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';const status=document.getElementById('status');const viewer=document.getElementById('viewer');let frame=null,sending=false,delivered=false;window.addEventListener('message',async e=>{if(!frame||e.source!==frame.contentWindow||e.data?.type!=='harlan-spelling-test-5-submitted'||sending||delivered)return;const responses=e.data.responses;if(!Array.isArray(responses)||responses.length!==30)return; sending=true;status.textContent='Sending answers to your teacher…';try{const user=auth.currentUser|| (await signInAnonymously(auth)).user;await setDoc(doc(db,'submissions','spelling5_'+user.uid),{student:'Harlan',studentUid:user.uid,testTitle:'Spelling & Vocabulary — Test 5',submittedAt:serverTimestamp(),responses:responses.map((r,i)=>({number:i+1,question:String(r.question||'').slice(0,500),answer:String(r.answer||'').slice(0,300),section:i<20?'Spelling':i<25?'Vocabulary':'Bonus'}))});delivered=true;status.textContent='Your test was delivered to your teacher.';frame.remove()}catch(err){status.textContent='Delivery was not confirmed. Keep this page open and ask your teacher. '+(err.code||'')}finally{sending=false}});try{if(!auth.currentUser)await signInAnonymously(auth);const release=await getDoc(doc(db,'assessmentReleases','spelling-test-5'));if(!release.exists()||release.data().released!==true){status.textContent='This test is locked. Your teacher has not released it yet.'}else{const content=await getDoc(doc(db,'protectedAssessments','spelling-test-5'));if(!content.exists()||typeof content.data().html!=='string'){status.textContent='Your teacher has not uploaded the secure test yet.'}else{frame=document.createElement('iframe');frame.title='Spelling Test 5';frame.style.cssText='width:100%;height:80vh;border:0';frame.srcdoc=content.data().html;viewer.append(frame);status.textContent='Your teacher released this test. Complete the questions, then submit.'}}}catch(e){status.textContent='This test is unavailable. Ask your teacher for help.'}</script></body></html>
