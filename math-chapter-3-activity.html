<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 3 Lesson | Math 6</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#17212b;font:19px/1.6 Arial,sans-serif}main{max-width:900px;margin:auto;padding:22px}h1{font-size:32px}a{color:#163e62}.back,.activity{display:block;background:white;border:3px solid #cbd4df;border-radius:16px;padding:16px;margin:14px 0;text-decoration:none;color:inherit}.activity strong{font-size:21px}.card{background:white;border:2px solid #cbd4df;border-radius:16px;padding:20px;margin:20px 0}button,input{font:inherit;padding:12px;border-radius:10px;border:2px solid #7c8b9a}button{background:#e1f1fa;cursor:pointer;margin:5px}button:focus,input:focus,a:focus{outline:4px solid #ffbd4a}input{width:min(100%,330px)}.feedback{font-weight:bold;min-height:32px}.hint{color:#415467}p{max-width:70ch}@media(max-width:600px){main{padding:12px}h1{font-size:27px}}</style></head><body><main><a class="back" href="math-chapter-3.html">← Chapter 3</a><h1 id="title"></h1><p id="goal"></p><button onclick="speak(document.getElementById('goal').textContent)">🔊 Read lesson explanation</button><button onclick="speechSynthesis.cancel()">■ Stop reading</button><section class="card"><h2>Let's learn</h2><p id="example"></p><button onclick="speak(document.getElementById('example').textContent)">🔊 Read example</button><p class="hint">Think about what each number means. Try an estimate first, then check your result.</p></section><h2>Try it yourself</h2><div id="questions"></div><a class="back" href="math-chapter-3.html">← All lessons</a></main><script>
const lessons=[["21","Division","Dividend, divisor, quotient, remainder; check by multiplication","36 ÷ 4","9",[["56 ÷ 7","8"],["128 ÷ 5 (write quotient r remainder)","25 r3"],["364 ÷ 7","52"]]],["22","Multiples of 10","Divisibility rules and compatible numbers","4,500 ÷ 50","90",[["590 is divisible by 2, 5, and 10. Type yes.","yes"],["1,860 ÷ 30","62"],["6,300 ÷ 90","70"]]],["23","2-Digit Divisors","Estimate first; adjust the quotient and interpret remainders","6,099 ÷ 83","73 r40",[["936 ÷ 52","18"],["3,852 ÷ 18","214"],["138 guests, 8 per table: how many tables?","18"]]],["24","Dividing a Decimal by a Whole Number","Continue dividing past the decimal; fractions can represent leftovers","5 ÷ 2","2.5",[["56 ÷ 4","14"],["17.6 ÷ 2","8.8"],["1 ÷ 8","0.125"]]],["25","Dividing a Decimal by 2-Digit Divisors","Estimate and round only at the end","51.92 ÷ 16","3.245",[["12.3 ÷ 82","0.15"],["390 ÷ 40","9.75"],["60 ÷ 37 (nearest hundredth)","1.62"]]],["26","Dividing by a Power of 10","Each factor of 10 shifts the place value one position","397 ÷ 100","3.97",[["387 ÷ 10","38.7"],["42.71 ÷ 100","0.4271"],["18 ÷ 100","0.18"]]],["27","Order of Operations","Parentheses, exponents, multiplication/division left to right, addition/subtraction left to right","8 − 3 × 4 ÷ 4","5",[["5 × (6 + 3)","45"],["6 − 3 + 5²","28"],["(20 − 4) ÷ 2 × 8","64"]]],["28","Multistep Problems","Choose operations from the story; use parentheses when needed","(100 + 125) ÷ 25","9",[["16 people get 3 bottles each; 12 bottles per package. Packages?","4"],["4 hours at $8 and 8 hours at $5. Total dollars?","72"],["Average of 100, 88, 92, and 84","91"]]],["review","Chapter Review","Practice the chapter's major division skills","486 ÷ 9","54",[["35 ÷ 7","5"],["72.16 ÷ 10","7.216"],["125 campers, 3 per canoe: canoes needed?","42"]]],["cumulative","Cumulative Review","Review prior skills and interpret a line graph","7,000 × 6","42000",[["375 ÷ 25","15"],["Average of $18,000 and $21,000","19500"],["Years 2013 through 2020 inclusive: how many years?","8"]]]];const key=new URLSearchParams(location.search).get('lesson')||'21';const lesson=lessons.find(x=>x[0]===key)||lessons[0];document.title=lesson[1]+' | Harlan Learning Hub';document.getElementById('title').textContent=(Number(lesson[0])?'Lesson '+lesson[0]+' — ':'')+lesson[1];document.getElementById('goal').textContent=lesson[2];document.getElementById('example').textContent='Example: '+lesson[3]+' = '+lesson[4]+'. Check your answer using the inverse operation when possible.';
function speak(t){if(!('speechSynthesis' in window)){alert('Read aloud is not available in this browser.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t.replaceAll('÷',' divided by ').replaceAll('×',' times ').replaceAll('²',' squared '));u.rate=.85;speechSynthesis.speak(u)}
const root=document.getElementById('questions');lesson[5].forEach((q,i)=>{const box=document.createElement('section');box.className='card';const heading=document.createElement('h3');heading.textContent='Question '+(i+1);const prompt=document.createElement('p');prompt.textContent=q[0];const read=document.createElement('button');read.textContent='🔊 Read question';read.onclick=()=>speak(q[0]);const input=document.createElement('input');input.setAttribute('aria-label','Answer to question '+(i+1));input.autocomplete='off';const check=document.createElement('button');check.textContent='Check answer';const hint=document.createElement('button');hint.textContent='Show hint';const feedback=document.createElement('p');feedback.className='feedback';feedback.setAttribute('role','status');hint.onclick=()=>{feedback.textContent='Hint: Use an estimate or inverse operation. For a word problem, decide whether you need to round up.'};check.onclick=()=>{const norm=s=>s.toLowerCase().replace(/[$,\s]/g,'').replace(/remainder/g,'r').replace(/\.0+$/,'');if(norm(input.value)===norm(q[1])){feedback.textContent='Correct! Great work.';feedback.style.color='#17623d'}else{feedback.textContent='Not quite. Try again. You can use the hint.';feedback.style.color='#8c3b13'}};box.append(heading,prompt,read,document.createElement('br'),input,check,hint,feedback);root.append(box)});
</script></body></html>
