<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harlan — Teacher Submission Reports</title>
<style>body{font:17px/1.5 system-ui,Arial,sans-serif;background:#f3f6fa;color:#183047;margin:0}main{max-width:940px;margin:auto;padding:24px} #categories{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0}#categories button{min-height:84px;font-size:20px;font-weight:650}#breadcrumbs button{background:#526d81}section{background:white;border:1px solid #c8d5e2;border-radius:14px;padding:20px;margin:16px 0}button,input,select{font:inherit;padding:10px;margin:4px;border-radius:7px}button{background:#155781;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}label{display:block;margin:10px 0}.item{display:block;width:100%;text-align:left;margin:8px 0}.muted{color:#53687a}.warn{color:#a13c14}article{padding:12px 0;border-top:1px solid #ddd;white-space:pre-wrap}#detail{overflow-wrap:anywhere}#responses article p{margin:8px 0}#responses article strong{display:block}#answerSummary{font-weight:700;padding:12px;background:#edf4f9;border-radius:8px}.answer-correct{border-left:5px solid #27764a;padding-left:14px}.answer-incorrect{border-left:5px solid #b13b32;padding-left:14px}.answer-unchecked{border-left:5px solid #8a98a7;padding-left:14px}@media print{#login,#list,#status,#back,#print,main>.muted{display:none!important}body{background:white}#detail{border:0;padding:0}}</style></head>
<body><main><h1>Harlan — Teacher Submission Reports</h1><p class="muted">READ-ONLY TEACHER REPORTS · View Harlan’s submitted answers and print a report.</p>
<section id="login"><h2>Teacher sign-in</h2><label>Email <input id="email" type="email" autocomplete="username"></label><label>Password <input id="password" type="password" autocomplete="current-password"></label><button id="signin">Sign in</button></section>
<p id="status" role="status">Checking teacher sign-in…</p>
<section id="list" hidden><h2 id="browseTitle">Choose a subject</h2><div id="breadcrumbs"></div><div id="categories"></div><div id="recordControls" hidden><button id="refresh">Refresh submissions</button><button id="signout">Sign out</button><p id="count"></p><div id="items"></div></div></section>
<section id="detail" hidden><button id="back">Back to submissions</button><button id="print" type="button">Print student answers</button><div id="responses"></div></section>
<p class="muted"><a href="teacher-dashboard.html">Return to existing teacher dashboard</a></p>
</main><script type="module">
import {auth,db} from './firebase-client.js';
import {decodeResponses} from './response-payload.js';
import {validateTeacherKey,checkTeacherAnswer} from './teacher-answer-check.js';
import {onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {collection,doc,getDoc,getDocs,query,orderBy} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const $=id=>document.getElementById(id), el=(tag,text)=>{const e=document.createElement(tag);e.textContent=String(text??'');return e};
let records=[];let reportVersion=0;let selectedSubject=null;let selectedType=null;const SUBJECTS=[["Language","book-open"],["History","globe"],["Math","calculator"],["Science","flask"],["Bible","book"]];
const subjectOf=s=>/math/i.test(s)?'Math':/canada|history|geography/i.test(s)?'History':'Other';

function navButton(label,fn){const b=el('button',label);b.onclick=fn;return b}
function draw(){
 const cats=$('categories'),crumb=$('breadcrumbs'),controls=$('recordControls');cats.replaceChildren();crumb.replaceChildren();
 if(!selectedSubject){$('browseTitle').textContent='Choose a subject';controls.hidden=true;
 for(const [name] of SUBJECTS){const count=records.filter(r=>r.subject===name).length;cats.append(navButton(name+'  ·  '+count+' submission'+(count===1?'':'s'),()=>{selectedSubject=name;selectedType=null;draw()}))}return}
 crumb.append(navButton('All subjects',()=>{selectedSubject=null;selectedType=null;draw()}));
 $('browseTitle').textContent=selectedSubject;
 if(!selectedType){controls.hidden=true;for(const type of ['Classwork','Quizzes','Tests']){const count=records.filter(r=>r.subject===selectedSubject&&r.group===type).length;cats.append(navButton(type+'  ·  '+count,()=>{selectedType=type;draw()}))}return}
 crumb.append(navButton(selectedSubject,()=>{selectedType=null;draw()}));
 $('browseTitle').textContent=selectedSubject+' — '+selectedType;controls.hidden=false;
 const list=records.filter(r=>r.subject===selectedSubject&&r.group===selectedType);
 $('count').textContent='Showing '+list.length+' submission'+(list.length===1?'':'s')+'.';
 $('items').replaceChildren();
 for(const r of list){const b=el('button',r.title+' · '+r.student+' · '+r.source);b.className='item';b.onclick=()=>show(r);$('items').append(b)}
 if(!list.length)$('items').append(el('p','No submissions in this category yet.'));
}
function groupOf(r){const v=(r.kind+' '+r.title).toLowerCase();if(/test|exam|assessment/.test(v))return 'Tests';if(/quiz/.test(v))return 'Quizzes';return 'Classwork'}
function updateFilters(){for(const r of records)r.group=groupOf(r)}
async function load(){if(!auth.currentUser)return;$('refresh').disabled=true;$('status').textContent='Loading submissions…';const [legacy,modern]=await Promise.allSettled([getDocs(query(collection(db,'submissions'),orderBy('submittedAt','desc'))),getDocs(collection(db,'assignmentStates'))]);records=[];const issues=[];
if(legacy.status==='fulfilled')legacy.value.forEach(s=>{const d=s.data();records.push({source:'Older format',kind:d.type||'Submission',subject:d.subject||subjectOf(d.testTitle||''),title:d.testTitle||'Assignment',assignmentId:d.assignmentId||null,student:d.student||'Student',responses:d.responses||[],date:d.submittedAt?.toDate?.()})});else issues.push('Older submissions: '+(legacy.reason?.code||legacy.reason?.message));
if(modern.status==='fulfilled'){for(const state of modern.value.docs){const d=state.data();if(!d.assignmentId||!d.studentUid)continue;try{const [assignment,attempt]=await Promise.all([getDoc(doc(db,'assignments',d.assignmentId)),getDoc(doc(db,'assignmentStates',state.id,'attempts',String(d.currentAttempt||1)))]);if(!attempt.exists())continue;const a=assignment.exists()?assignment.data():{},data=attempt.data();records.push({source:'New format',kind:a.type||'Assessment',subject:a.subject||'Other',title:a.title||d.assignmentId,assignmentId:d.assignmentId,student:d.studentUid,responses:[],raw:data,date:data.submittedAt?.toDate?.()})}catch(e){issues.push('New attempt '+state.id+': '+(e.code||e.message))}}}else issues.push('New submissions: '+(modern.reason?.code||modern.reason?.message));
records.sort((a,b)=>(b.date?.getTime?.()||0)-(a.date?.getTime?.()||0));updateFilters();draw();$('status').textContent='Loaded '+records.length+' records ('+records.filter(r=>r.source==='New format').length+' new; '+records.filter(r=>r.source==='Older format').length+' older).'+(issues.length?' Some data could not be read: '+issues.join('; '):'');$('refresh').disabled=false}
async function show(r){
 const version=++reportVersion;
 $('list').hidden=true;$('detail').hidden=false;
 const box=$('responses');box.replaceChildren(el('h2',r.title),el('p','Student reference: '+r.student+' · '+r.source+' · Submitted: '+(r.date?.toLocaleString?.()||'Date unavailable')));if(/sample|replaced/i.test(r.title))box.append(el('p','SAMPLE / REPLACED ASSIGNMENT — not a current lesson submission.'));
 let responses=[];
 if(r.source==='Older format'){responses=Array.isArray(r.responses)?r.responses:[]}
 else{const decoded=decodeResponses(r.raw||{});if(decoded.responseError){box.append(el('p','Unable to decode this saved attempt: '+decoded.responseError));return}responses=decoded.responses}
 const note=el('p','Checking for a protected teacher answer key…');box.append(note);
 let key=null;
 if(r.assignmentId){try{const snap=await getDoc(doc(db,'teacherAnswerKeys',r.assignmentId));if(version!==reportVersion)return;if(snap.exists()){const d=snap.data();key=validateTeacherKey(d);if(!key)note.textContent='Teacher answer key exists, but it does not pass validation.';}else note.textContent='No verified teacher answer key is available for this assignment.';}catch(e){if(version!==reportVersion)return;note.textContent='Teacher answer key unavailable ('+(e.code||'access restricted')+').'}}else note.textContent='This older submission has no linked assignment ID for a protected answer key.';
 if(key)note.textContent='Verified-format teacher answer key loaded.';
 if(!responses.length){box.append(el('p','No answers were found in this submission.'));return}
 const summary=el('p','');summary.id='answerSummary';box.append(summary);const counts={correct:0,incorrect:0,'teacher-review':0,'not-checked':0};
 for(const [i,q] of responses.entries()){
  const article=el('article','');article.append(el('strong',(q.number??i+1)+'. '+(q.question||'Question text unavailable')));
  article.append(el('p','Harlan’s answer: '+(q.answer==null||q.answer===''?'(No answer)':q.answer)));
  if(q.work)article.append(el('p','Shown work: '+q.work));
  if(Array.isArray(q.checks)&&q.checks.length){
   article.append(el('p','Work checks: '+q.checks.length));
   for(const [j,check] of q.checks.entries())article.append(el('p','Attempt '+(j+1)+': '+(check.answer||'(No answer)')+' — '+(check.correct?'correct':'needs retry')));
  }
  const result=checkTeacherAnswer({number:Number(q.number??i+1),answer:q.answer},key);counts[result.status]++;article.className=result.status==='correct'?'answer-correct':result.status==='incorrect'?'answer-incorrect':'answer-unchecked';
  const labels={correct:'Correct (verified answer key)',incorrect:'Incorrect (verified answer key)','teacher-review':'Teacher review needed','not-checked':'Not checked — verified answer key not connected'};
  article.append(el('p','Answer status: '+labels[result.status]));
  if(result.status==='incorrect')article.append(el('p','Correct answer: '+result.correctAnswer));
  box.append(article)
 }
 summary.textContent='Answer check summary: '+counts.correct+' correct · '+counts.incorrect+' incorrect · '+counts['teacher-review']+' need teacher review · '+counts['not-checked']+' not checked.';

}
$('signin').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('status').textContent='Sign-in failed: '+(e.code||e.message)}};
$('signout').onclick=()=>signOut(auth);$('print').onclick=()=>window.print();$('refresh').onclick=load;$('back').onclick=()=>{reportVersion++;$('detail').hidden=true;$('list').hidden=false};
onAuthStateChanged(auth,async user=>{$('login').hidden=!!user;$('list').hidden=!user;$('detail').hidden=true;if(user)await load();else $('status').textContent='Sign in with an authorized teacher account.'});
</script></body></html>
