<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Assignment — Student Preview</title><style>body{font-family:system-ui,Arial,sans-serif;background:#f5f7fb;color:#183149;margin:0}main{max-width:760px;margin:auto;padding:26px}.card{background:white;border:1px solid #cbd5e1;border-radius:16px;padding:24px;margin:18px 0}label{display:block;font-weight:600;margin:12px 0 5px}input,textarea,button{font:inherit;padding:12px;border-radius:9px}input,textarea{width:100%;border:1px solid #94a3b8}textarea{min-height:200px}button{background:#23577e;color:white;border:0;cursor:pointer}button:disabled{opacity:.6}.hidden{display:none}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main><h1>Class Assignment</h1><p><a href="index.html">Return to Learning Hub</a></p><p id="status" role="status">Preparing assignment…</p><section id="assignment" class="card hidden"><h2 id="title"></h2><p id="subject"></p><pre id="instructions"></pre><form id="form"><label for="student">Student name</label><input id="student" maxlength="100" required><label for="answer">Your response</label><textarea id="answer" required></textarea><p><button id="submit" type="submit">Submit assignment</button></p></form></section></main><script type="module">
import {auth,db} from './firebase-client.js';
import {onAuthStateChanged,signInAnonymously} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {doc,getDoc,setDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const $=id=>document.getElementById(id),resourceId=new URLSearchParams(location.search).get('id');
let resource=null,user=null;function say(s){$('status').textContent=s}
onAuthStateChanged(auth,async current=>{if(!resourceId||!/^[A-Za-z0-9]{10,80}$/.test(resourceId)){say('This assignment link is invalid.');return}if(!current){try{await signInAnonymously(auth)}catch(e){say('Could not start student session: '+e.code)}return}user=current;if(!current.isAnonymous){say('Use a student session to submit assignments.');return}
try{const snap=await getDoc(doc(db,'publishedResources',resourceId));if(!snap.exists()){say('Assignment not found.');return}resource=snap.data();if(!['quiz','test','assignment'].includes(resource.type)){say('This is not a student submission assignment.');return}
const prior=await getDoc(doc(db,'classSubmissions',resourceId+'_'+user.uid)).catch(()=>null);if(prior?.exists()){$('assignment').classList.add('hidden');say('You already submitted this assignment from this student session.');return}
$('title').textContent=resource.title;$('subject').textContent='Subject: '+resource.subject;$('instructions').textContent=resource.content;$('assignment').classList.remove('hidden');say('Complete your work and submit once.');
}catch(e){say('Could not load assignment: '+e.code)}});
$('form').onsubmit=async e=>{e.preventDefault();if(!user?.isAnonymous||!resource)return;const button=$('submit');button.disabled=true;try{await setDoc(doc(db,'classSubmissions',resourceId+'_'+user.uid),{resourceId,subject:resource.subject,studentUid:user.uid,student:$('student').value.trim(),responses:[{answer:$('answer').value}],submittedAt:serverTimestamp()});$('assignment').classList.add('hidden');say('Assignment submitted successfully.')}catch(err){say('Submission failed: '+err.code);button.disabled=false}};
</script></body></html>
