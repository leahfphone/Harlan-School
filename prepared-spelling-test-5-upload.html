<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test 5 — Spelling & Vocabulary (Locked Draft)</title><style>body{font:20px/1.5 Arial,sans-serif;background:#f3f6fa;color:#172b40;margin:0}main{max-width:850px;margin:auto;padding:20px}section{background:white;border:2px solid #c5d3df;border-radius:16px;padding:22px;margin:18px 0}h1{font-size:30px}button{font:inherit;cursor:pointer;border-radius:12px;padding:13px 18px;border:2px solid #66829d;background:#e9f1f8;color:#183751;margin:7px}button:focus-visible{outline:4px solid #efba51}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choices button{text-align:left;min-height:75px;margin:0}.choices button[aria-pressed=true]{background:#c8e9d9;border-color:#116343}.muted{color:#516579}.hidden{display:none}@media(max-width:650px){.choices{grid-template-columns:1fr}main{padding:10px}section{padding:15px}}</style></head><body><main><a href="spelling-vocabulary.html">← Spelling & Vocabulary</a><h1>TEST 5</h1><p>Spelling, Vocabulary, & Poetry 6</p><section id="test"><p class="muted">Name: Harlan · Regular: 100 points · Bonus: 5 points</p><p>Choose one answer for each question. You may listen again whenever needed.</p><div id="questions"></div><button id="submit">Submit to teacher</button><p id="status" role="status"></p></section></main><script>
/* Private draft only. Do not publish or enable this assessment until the dashboard's server-side release and submission APIs are connected. */
const questions=[{"prompt":"Listen to the word. Which spelling is correct?","audio":"get","options":["get","gett","git","geat"]},{"prompt":"Listen to the word. Which spelling is correct?","audio":"next","options":["nexst","next","neckt","nekst"]},{"prompt":"Listen to the word. Which spelling is correct?","audio":"send","options":["send","sende","sind","sennd"]},{"prompt":"Listen to the word. Which spelling is correct?","audio":"then","options":["thenn","then","thene","thun"]},{"prompt":"Listen to the word. Which spelling is correct?","audio":"spend","options":["spind","spende","spennd","spend"]},{"prompt":"Listen to the word. Which spelling is correct?","audio":"went","options":["wennt","went","whent","wint"]},{"prompt":"Listen to the word. Which spelling is correct?","audio":"read","options":["reed","red","read","reade"]},{"prompt":"Listen to the word. Which spelling is correct?","audio":"head","options":["hedd","heed","head","hed"]},{"prompt":"Listen to the word. Which spelling is correct?","audio":"dead","options":["ded","deed","dead","deadd"]},{"prompt":"Listen to the word. Which spelling is correct?","audio":"dread","options":["dred","dreed","dreadd","dread"]},{"prompt":"Listen to the word. Which spelling is correct?","audio":"bread","options":["breade","bredd","bred","bread"]},{"prompt":"Listen to the word. Which spelling is correct?","audio":"spread","options":["spreed","spred","spreadd","spread"]},{"prompt":"Listen to the word. Which spelling is correct?","audio":"those","options":["those","thos","thoes","thoze"]},{"prompt":"Listen to the word. Which spelling is correct?","audio":"upon","options":["upone","upon","apon","uppon"]},{"prompt":"Listen to the word. Which spelling is correct?","audio":"us","options":["use","us","uz","uss"]},{"prompt":"Listen to the word. Which spelling is correct?","audio":"transfer","options":["transfer","transfur","tranfer","transferr"]},{"prompt":"Listen to the word. Which spelling is correct?","audio":"conifer","options":["conifer","connifer","conifur","coniferre"]},{"prompt":"Listen to the word. Which spelling is correct?","audio":"monopoly","options":["monopaly","monoppoly","monoply","monopoly"]},{"prompt":"Listen to the word. Which spelling is correct?","audio":"visible","options":["visible","visibel","vissible","visable"]},{"prompt":"Listen to the word. Which spelling is correct?","audio":"reliable","options":["reliable","relyible","relyable","reliabel"]},{"prompt":"What does transfer mean?","audio":"What does transfer mean?","options":["able to be trusted; dependable","able to be seen","a cone-bearing tree","to move or carry from one place or person to another"]},{"prompt":"What does conifer mean?","audio":"What does conifer mean?","options":["able to be trusted; dependable","able to be seen","a cone-bearing tree","to move or carry from one place or person to another"]},{"prompt":"What does monopoly mean?","audio":"What does monopoly mean?","options":["control of many businesses by one company","able to be trusted; dependable","a cone-bearing tree","able to be seen"]},{"prompt":"What does visible mean?","audio":"What does visible mean?","options":["able to be trusted; dependable","able to be seen","a cone-bearing tree","to move or carry from one place or person to another"]},{"prompt":"What does reliable mean?","audio":"What does reliable mean?","options":["a cone-bearing tree","control of many businesses by one company","able to be trusted; dependable","able to be seen"]}],bonus=[{"prompt":"The pine tree is a ______ because it produces cones.","options":["visible","conifer","reliable","transfer"]},{"prompt":"Please ______ the photograph from the tablet to the computer.","options":["transfer","monopoly","dread","spread"]},{"prompt":"The instructions were printed clearly, so every word was ______.","options":["reliable","visible","dead","upon"]},{"prompt":"Which situation shows a monopoly?","options":["Four stores compete for customers.","One company controls all the local bus service."]},{"prompt":"Which person is most reliable?","options":["Someone who keeps promises.","Someone who often forgets commitments."]}];
const section=document.getElementById('test');
function speak(s){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.rate=.78;speechSynthesis.speak(u)}
function render(){const el=document.getElementById('questions');[...questions,...bonus].forEach((q,i)=>{const wrap=document.createElement('section');const title=document.createElement('h2');title.textContent=(i>=25?'Bonus ':'')+(i+1)+'. '+q.prompt;wrap.append(title);const listen=document.createElement('button');listen.textContent='🔊 Read question'+(q.audio?' / word':'');listen.onclick=()=>speak(q.audio||q.prompt);wrap.append(listen);const choices=document.createElement('div');choices.className='choices';q.options.forEach((o,j)=>{const b=document.createElement('button');b.textContent=String.fromCharCode(65+j)+'. '+o;b.setAttribute('aria-pressed','false');b.onclick=()=>{choices.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true')};choices.append(b)});wrap.append(choices);el.append(wrap)})}render();
document.getElementById('submit').onclick=()=>{const all=[...questions,...bonus];const responses=[...document.querySelectorAll('#questions > section')].map((wrap,i)=>({question:all[i].prompt,answer:wrap.querySelector('button[aria-pressed="true"]')?.textContent||''}));if(responses.some(x=>!x.answer)){document.getElementById('status').textContent='Please answer all 30 questions before submitting.';return;}window.parent.postMessage({type:'harlan-spelling-test-5-submitted',responses},'*');document.getElementById('status').textContent='Sending your test. Wait for teacher delivery confirmation.'};
</script></body></html>
