<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canada Test 2 | Harlan's Learning Hub</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#16273a}#delivery{position:sticky;top:0;z-index:10;padding:14px;background:#fff4d9;border-bottom:2px solid #d8a746;font-weight:600}iframe{display:block;width:100%;height:100vh;border:0}button{font:inherit;padding:10px;border-radius:9px;background:#244d77;color:white;border:0}#retry{display:none}</style></head><body><div id="delivery" role="status">Complete your test below. After submitting, wait for confirmation that your answers reached your teacher. <button id="retry">Retry delivery</button></div><iframe id="test" title="Canada Test 2" src="harlan-canada-test-2.html"></iframe><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getAuth,signInAnonymously}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import{getFirestore,doc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';const app=initializeApp({apiKey:'AIzaSyCyp8bBl38v5Gb8xVsQrfmdnEXisarqBQQ',authDomain:'harlan-learning-hub.firebaseapp.com',projectId:'harlan-learning-hub',appId:'1:341058218983:web:cb24701e93a511fd336b42'}),auth=getAuth(app),db=getFirestore(app),frame=document.getElementById('test'),status=document.getElementById('delivery'),retry=document.getElementById('retry');let sending=false,delivered=false;const teacherMode=new URLSearchParams(location.search).get('teacher')==='1';if(teacherMode){status.textContent='Teacher test mode: enter Test Student, then use the test normally or click Quick Test Submission. This creates a real test record in your dashboard.';const b=document.createElement('button');b.textContent='Quick Test Submission';b.style.marginLeft='12px';status.append(b);b.onclick=()=>{const w=frame.contentWindow,d=frame.contentDocument;if(!d?.getElementById('start'))return;const st=d.getElementById('student');st.value='Test Student';st.dispatchEvent(new Event('input',{bubbles:true}));const state={student:'Test Student',answers:Array(73).fill('[Teacher test mode — sample response]'),submitted:true,timestamp:new Date().toLocaleString()};w.localStorage.setItem('harlan_canada_test2_v1',JSON.stringify(state));frame.src='harlan-canada-test-2.html?teacherPreview='+Date.now()}}async function deliver(){if(sending||delivered)return;const win=frame.contentWindow,raw=win.localStorage.getItem('harlan_canada_test2_v1');if(!raw)return;let state;try{state=JSON.parse(raw)}catch{return}if(!state.submitted)return;const rows=[...frame.contentDocument.querySelectorAll('#reviewQuestions article')];if(rows.length!==73){status.textContent='The complete test is not ready to send. Please ask your teacher for help.';return}const responses=rows.map((row,i)=>({number:i+1,question:row.querySelector('strong')?.textContent||'',answer:(row.querySelector('p')?.textContent||'').replace(/^Answer:\s*/,''),section:''}));sending=true;retry.style.display='none';status.textContent='Sending your completed test securely to your teacher...';try{const cred=auth.currentUser?.isAnonymous?{user:auth.currentUser}:await signInAnonymously(auth);await setDoc(doc(db,'submissions',cred.user.uid),{student:(state.student||'Harlan').slice(0,100),studentUid:cred.user.uid,testTitle:'Canada — Test 2',submittedAt:serverTimestamp(),responses});delivered=true;status.textContent='Your completed test was delivered to your teacher. You may close this page.'}catch(e){status.textContent='Delivery not confirmed ('+(e.code||'connection issue')+'). Your answers are saved on this iPad. Tap Retry delivery or ask your teacher for help.';retry.style.display='inline-block'}finally{sending=false}}retry.onclick=deliver;frame.onload=()=>{const d=frame.contentDocument;new MutationObserver(()=>{if(!d.getElementById('submitted')?.classList.contains('hidden'))deliver()}).observe(d.body,{subtree:true,attributes:true,attributeFilter:['class']});deliver()};</script></body></html>
